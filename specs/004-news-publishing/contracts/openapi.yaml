components:
  securitySchemes:
    sessionCookie:
      type: apiKey
      in: cookie
      name: caab.session
  schemas:
    Metadata:
      type: object
      additionalProperties: false
      properties:
        title:
          type: string
          maxLength: 200
        summary:
          type: string
          maxLength: 500
        slug:
          type: string
          maxLength: 180
          pattern: ^(?:[a-z0-9]+(?:-[a-z0-9]+)*)?$
        category:
          type: string
          maxLength: 80
        tags:
          type: array
          maxItems: 20
          items:
            type: string
            maxLength: 80
            minLength: 1
        channels:
          type: array
          maxItems: 2
          uniqueItems: true
          items:
            enum:
              - site
              - app
        cover:
          anyOf:
            - type: "null"
            - type: object
              additionalProperties: false
              properties:
                fileId:
                  type: string
                  format: uuid
                alt:
                  type: string
                  maxLength: 500
              required:
                - fileId
        highlight:
          anyOf:
            - type: "null"
            - type: object
              additionalProperties: false
              properties:
                order:
                  type: integer
                  minimum: 1
                  maximum: 100
              required:
                - order
      required: []
    Body:
      type: object
      additionalProperties: false
      properties:
        root:
          $ref: "#/components/schemas/BodyNode"
      required:
        - root
    BodyNode:
      type: object
      description: "Canonical Lexical tree: root contains paragraphs, h2/h3 headings, lists or news-image
        blocks. An image requires a UUID fileId owned by this news item; alt and caption are plain
        text, max 500 characters. URLs and executable attributes are never stored. Alt may be empty
        in drafts but is required for publication. Images are top-level only. Max 2000 nodes, depth
        12, 100000 text characters."
      required:
        - type
        - version
      properties:
        type:
          enum:
            - root
            - paragraph
            - heading
            - list
            - listitem
            - text
            - linebreak
            - news-image
        version:
          const: 1
        children:
          type: array
          items:
            $ref: "#/components/schemas/BodyNode"
        text:
          type: string
          maxLength: 100000
        format:
          anyOf:
            - type: integer
              minimum: 0
              maximum: 3
            - enum:
                - ""
                - left
                - right
                - center
                - justify
                - start
                - end
        tag:
          enum:
            - h2
            - h3
            - ul
            - ol
        listType:
          enum:
            - bullet
            - number
        direction:
          enum:
            - ltr
            - rtl
            - null
        indent:
          type: integer
          minimum: 0
          maximum: 8
        fileId:
          type: string
          format: uuid
        alt:
          type: string
          maxLength: 500
        caption:
          type: string
          maxLength: 500
    CreateDraft:
      type: object
      additionalProperties: false
      properties:
        metadata:
          $ref: "#/components/schemas/Metadata"
        body:
          $ref: "#/components/schemas/Body"
      required:
        - metadata
    UpdateDraft:
      type: object
      additionalProperties: false
      properties:
        expectedVersion:
          type: integer
          minimum: 1
          maximum: 9007199254740991
        metadata:
          $ref: "#/components/schemas/Metadata"
        body:
          $ref: "#/components/schemas/Body"
      required:
        - expectedVersion
        - metadata
        - body
    VersionCommand:
      type: object
      additionalProperties: false
      properties:
        expectedVersion:
          type: integer
          minimum: 1
          maximum: 9007199254740991
      required:
        - expectedVersion
    RestoreRevision:
      type: object
      additionalProperties: false
      properties:
        expectedVersion:
          type: integer
          minimum: 1
          maximum: 9007199254740991
        versionId:
          type: string
          format: uuid
      required:
        - expectedVersion
        - versionId
    News:
      type: object
      additionalProperties: false
      properties:
        id:
          type: string
          format: uuid
        metadata:
          $ref: "#/components/schemas/Metadata"
        body:
          $ref: "#/components/schemas/Body"
        revision:
          type: integer
          minimum: 1
          maximum: 9007199254740991
        archived:
          type: boolean
        editorUserId:
          type: string
          format: uuid
        updatedAt:
          type: string
          format: date-time
      required:
        - id
        - metadata
        - body
        - revision
        - archived
        - editorUserId
        - updatedAt
    Revision:
      type: object
      additionalProperties: false
      properties:
        id:
          type: string
          format: uuid
        revision:
          type: integer
          minimum: 1
          maximum: 9007199254740991
        title:
          type: string
          maxLength: 200
        editorUserId:
          type: string
          format: uuid
        createdAt:
          type: string
          format: date-time
        archived:
          type: boolean
      required:
        - id
        - revision
        - title
        - editorUserId
        - createdAt
        - archived
    Error:
      type: object
      required:
        - code
        - message
        - requestId
      properties:
        code:
          type: string
        message:
          type: string
        requestId:
          type: string
          format: uuid
        fields:
          type: array
          items:
            type: object
    NewsPage:
      type: object
      additionalProperties: false
      properties:
        items:
          type: array
          items:
            $ref: "#/components/schemas/News"
        page:
          type: integer
          minimum: 1
          maximum: 9007199254740991
        totalPages:
          type: integer
          minimum: 0
      required:
        - items
        - page
        - totalPages
    RevisionPage:
      type: object
      additionalProperties: false
      properties:
        items:
          type: array
          items:
            $ref: "#/components/schemas/Revision"
        page:
          type: integer
          minimum: 1
          maximum: 9007199254740991
        totalPages:
          type: integer
          minimum: 0
      required:
        - items
        - page
        - totalPages
    Media:
      type: object
      additionalProperties: false
      properties:
        id:
          type: string
          format: uuid
        name:
          type: string
        status:
          enum:
            - initiated
            - uploaded
            - scanning
            - available
            - rejected
            - scan_error
            - deleted
        mime:
          type: string
        usable:
          type: boolean
      required:
        - id
        - name
        - status
        - mime
        - usable
    MediaPage:
      type: object
      additionalProperties: false
      properties:
        items:
          type: array
          maxItems: 25
          items:
            $ref: "#/components/schemas/Media"
        page:
          type: integer
          minimum: 1
          maximum: 9007199254740991
        hasNextPage:
          type: boolean
      required:
        - items
        - page
        - hasNextPage
    PublishNews:
      type: object
      additionalProperties: false
      properties:
        expectedVersion:
          type: integer
          minimum: 1
          maximum: 9007199254740991
        channels:
          type: array
          minItems: 1
