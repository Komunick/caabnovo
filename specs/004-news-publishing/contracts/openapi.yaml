openapi: 3.1.1
info:
  title: CAAB News API
  version: 1.0.0
  description: Editorial management using the existing panel session. Published content is publicly
    readable by explicit user decision on 2026-09-09; drafts and history remain private. Delivery is
    pull-based and does not imply consumer acknowledgement or push notification.
servers:
  - url: /api/v1
security:
  - sessionCookie: []
paths:
  /news:
    get:
      operationId: listNewsDrafts
      summary: List latest editorial versions with combined filters and sorting
      parameters:
        - name: page
          in: query
          schema:
            type: integer
            minimum: 1
            maximum: 100000
            default: 1
        - name: state
          in: query
          schema:
            enum:
              - active
              - archived
              - all
            default: active
        - name: search
          in: query
          schema:
            type: string
            maxLength: 200
        - name: collection
          in: query
          description: Published means any publication in history; drafts have never been published.
          schema:
            enum: [all, published, drafts]
            default: all
        - name: category
          in: query
          schema:
            type: string
            maxLength: 80
        - name: channel
          in: query
          description: Intended destination of the latest editorial revision.
          schema:
            enum: [all, app, site]
            default: all
        - name: highlight
          in: query
          schema:
            enum: [all, "yes", "no"]
            default: all
        - name: cover
          in: query
          schema:
            enum: [all, "yes", "no"]
            default: all
        - name: updatedWithin
          in: query
          schema:
            enum: [all, "7", "30", "90"]
            default: all
        - name: sort
          in: query
          schema:
            enum: [updated-desc, updated-asc, created-desc, created-asc, title-asc, title-desc]
            default: updated-desc
      responses:
        "200":
          description: Success
          headers:
            Cache-Control:
              schema:
                const: private, no-store
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/NewsPage"
        "401":
          description: Active panel session required
          headers:
            Cache-Control:
              schema:
                const: private, no-store
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "403":
          description: Request denied
          headers:
            Cache-Control:
              schema:
                const: private, no-store
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "404":
          description: News or revision not found
          headers:
            Cache-Control:
              schema:
                const: private, no-store
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "409":
          description: Version or idempotency conflict
          headers:
            Cache-Control:
              schema:
                const: private, no-store
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "422":
          description: Invalid input
          headers:
            Cache-Control:
              schema:
                const: private, no-store
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "500":
          description: Unexpected error; no internal details
          headers:
            Cache-Control:
              schema:
                const: private, no-store
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
    post:
      operationId: createNewsDraft
      summary: Create an incomplete draft; omitted body is empty
      parameters:
        - name: Origin
          in: header
          required: true
          description: Must match the request origin.
          schema:
            type: string
        - name: X-CSRF-Token
          in: header
          required: true
          schema:
            type: string
            minLength: 32
        - name: Idempotency-Key
          in: header
          required: true
          schema:
            type: string
            maxLength: 128
            minLength: 16
      requestBody:
        required: true
        description: UTF-8 JSON, at most 1048576 bytes including streamed requests.
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CreateDraft"
      responses:
        "201":
          description: Success
          headers:
            Cache-Control:
              schema:
                const: private, no-store
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/News"
        "401":
          description: Active panel session required
          headers:
            Cache-Control:
              schema:
                const: private, no-store
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "403":
          description: Request denied
          headers:
            Cache-Control:
              schema:
                const: private, no-store
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "404":
          description: News or revision not found
          headers:
            Cache-Control:
              schema:
                const: private, no-store
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "409":
          description: Version or idempotency conflict
          headers:
            Cache-Control:
              schema:
                const: private, no-store
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "413":
          description: Request body exceeds limit
          headers:
            Cache-Control:
              schema:
                const: private, no-store
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "422":
