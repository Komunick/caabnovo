name: Promotion policy

on:
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  validate-source:
    runs-on: ubuntu-latest
    steps:
      - name: Require dev as promotion source
        env:
          HEAD_REF: ${{ github.head_ref }}
        run: test "$HEAD_REF" = "dev"
      - uses: actions/checkout@v4
      - name: Require approved privacy and retention controls
        run: 'grep -Fx "Status: APPROVED" specs/001-project-foundation/evidence/privacy.md'
