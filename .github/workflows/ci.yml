name: CI

on:
  pull_request:
    branches: [dev, main]
  push:
    branches: [feature/**, fix/**, chore/**, docs/**]

permissions:
  contents: read

jobs:
  quality:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: pnpm
      - run: corepack enable
      - run: pnpm install --frozen-lockfile
      - run: pnpm format:check
      - name: Test branch protection tooling
        shell: pwsh
        run: ./infra/github/test-rulesets.ps1
      - run: pnpm lint
      - run: pnpm typecheck
      - run: pnpm test:unit
      - run: pnpm test:contract
      - run: pnpm test:integration
      - run: pnpm build

  browser:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    env:
      S3_SECRET_KEY: replace-me-local-only
      DATABASE_URL: postgresql://caab_runtime:change-me-runtime@127.0.0.1:5432/caab
      BETTER_AUTH_SECRET: e2e-only-secret-with-at-least-32-characters
      BETTER_AUTH_URL: http://localhost:3000
      MAIL_MODE: local
      SMTP_HOST: 127.0.0.1
      SMTP_PORT: 1025
      S3_ENDPOINT: http://127.0.0.1:9000
      S3_ACCESS_KEY: caab-local
      S3_QUARANTINE_BUCKET: caab-quarantine
      S3_PRIVATE_BUCKET: caab-private
      S3_PUBLIC_BUCKET: caab-public
      CLAMAV_HOST: 127.0.0.1
      OTEL_EXPORTER_OTLP_ENDPOINT: http://127.0.0.1:4318
    services:
      mailpit:
        image: axllent/mailpit:v1.27.4
        ports:
          - 1025:1025
          - 8025:8025
      postgres:
        image: postgres:18-alpine
        env:
          POSTGRES_DB: caab
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: change-me
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d caab" --health-interval 10s --health-timeout 5s
          --health-retries 5
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: pnpm
      - run: corepack enable
      - run: pnpm install --frozen-lockfile
      - name: Disable unused Google Chrome package source
        # Playwright downloads its own Chromium. A stale Google APT index must not
        # prevent installation of the Ubuntu libraries that browser needs.
        run: |
          if [ -f /etc/apt/sources.list.d/google-chrome.list ]; then
            sudo mv /etc/apt/sources.list.d/google-chrome.list /etc/apt/sources.list.d/google-chrome.list.disabled
          fi
      - run: pnpm exec playwright install --with-deps chromium
      - name: Start storage and antivirus for editorial media
        run: |
          docker compose up -d --wait storage clamav
          docker compose run --rm storage-init
      - name: Prepare synthetic accounts and start upload worker
        run: |
          pnpm db:seed:dev
          pnpm dev:worker > /tmp/caab-e2e-worker.log 2>&1 &
      - run: pnpm test:e2e --project=chromium
      - run: pnpm test:a11y --project=chromium

  security:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: pnpm
      - run: corepack enable
      - run: pnpm install --frozen-lockfile
      - run: pnpm security:scan
      - name: Scan repository history for secrets
        uses: docker://zricethezav/gitleaks:v8.28.0
        with:
          args: git /github/workspace --redact --no-banner
