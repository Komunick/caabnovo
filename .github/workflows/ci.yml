name: CI

on:
  pull_request:
    branches: [dev, main]
  push:
    branches: [feature/**, fix/**, chore/**, docs/**]

permissions:
  contents: read

jobs:
  quality:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: pnpm
      - run: corepack enable
      - run: pnpm install --frozen-lockfile
      - run: pnpm format:check
      - name: Test branch protection tooling
        shell: pwsh
        run: ./infra/github/test-rulesets.ps1
      - run: pnpm lint
      - run: pnpm typecheck
      - run: pnpm test:unit
      - run: pnpm test:contract
      - run: pnpm test:integration
      - run: pnpm build
      - name: Preserve compiled preview for low-memory local review
        uses: actions/upload-artifact@v7
        with:
          name: compiled-web-preview
          path: |
            apps/web/.next/**
            !apps/web/.next/cache/**
            !apps/web/.next/dev/**
          include-hidden-files: true
          retention-days: 3
          if-no-files-found: error

  browser:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    env:
      FILE_STORAGE_BACKEND: database
      DATABASE_URL: postgresql://caab_runtime:change-me-runtime@127.0.0.1:5432/caab
      BETTER_AUTH_SECRET: e2e-only-secret-with-at-least-32-characters
      BETTER_AUTH_URL: http://localhost:3000
      MAIL_MODE: local
      SMTP_HOST: 127.0.0.1
      SMTP_PORT: 1025
      CLAMAV_HOST: 127.0.0.1
      OTEL_EXPORTER_OTLP_ENDPOINT: http://127.0.0.1:4318
    services:
      mailpit:
        image: axllent/mailpit:v1.27.4
        ports:
          - 1025:1025
          - 8025:8025
      postgres:
        image: postgres:18-alpine
        env:
          POSTGRES_DB: caab
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: change-me
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d caab" --health-interval 10s --health-timeout 5s
          --health-retries 5
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: pnpm
      - run: corepack enable
      - run: pnpm install --frozen-lockfile
      - name: Disable unused Google Chrome package source
        # Playwright downloads its own Chromium. A stale Google APT index must not
        # prevent installation of the Ubuntu libraries that browser needs.
        run: |
          if [ -f /etc/apt/sources.list.d/google-chrome.list ]; then
            sudo mv /etc/apt/sources.list.d/google-chrome.list /etc/apt/sources.list.d/google-chrome.list.disabled
          fi
      - run: pnpm exec playwright install --with-deps chromium
      - name: Start antivirus for database media
        run: |
          docker compose up -d --wait clamav
      - name: Prepare synthetic accounts and start upload worker
        run: |
          pnpm db:seed:dev
          pnpm dev:worker > /tmp/caab-e2e-worker.log 2>&1 &
      - run: pnpm test:e2e --project=chromium
      - name: Preserve synthetic OAB screenshots
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: oab-result-synthetic-screenshots
          path: apps/web/test-results/**/oab-result-*.png
          retention-days: 7
          if-no-files-found: warn
      - name: Preserve news creation screenshots
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: news-creation-synthetic-screenshots
          path: apps/web/test-results/**/news-creation-*.png
          retention-days: 7
          if-no-files-found: warn
      - name: Preserve synthetic member document screenshots
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: member-documents-synthetic-screenshots
          path: apps/web/test-results/**/member-documents-*.png
          retention-days: 7
          if-no-files-found: warn
      - name: Preserve plain-language audit screenshots
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: audit-plain-synthetic-screenshots
          path: apps/web/test-results/**/audit-plain-*.png
          retention-days: 7
          if-no-files-found: warn

      - name: Preserve global function search screenshots
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: workspace-function-synthetic-screenshots
          path: apps/web/test-results/**/workspace-function-*.png
          retention-days: 7
          if-no-files-found: warn

      - name: Preserve navigation loading screenshots
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: navigation-synthetic-screenshots
          path: apps/web/test-results/**/navigation-*.png
          retention-days: 7
          if-no-files-found: warn

      - run: pnpm test:a11y --project=chromium

  security:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: pnpm
      - run: corepack enable
      - run: pnpm install --frozen-lockfile
      - run: pnpm security:scan
      - name: Scan repository history for secrets
        uses: docker://zricethezav/gitleaks:v8.28.0
        with:
          args: git /github/workspace --redact --no-banner
