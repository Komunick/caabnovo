name: caab-foundation

services:
  postgres:
    image: postgres:18-alpine
    environment:
      POSTGRES_DB: caab
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: change-me
    ports:
      - "5432:5432"
    volumes:
      - caab-postgres:/var/lib/postgresql
      - ./infra/postgres/init.sql:/docker-entrypoint-initdb.d/001-init.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d caab"]
      interval: 5s
      timeout: 3s
      retries: 20

  storage:
    image: minio/minio:RELEASE.2025-09-07T16-13-09Z
    command: server /data --console-address :9001
    environment:
      MINIO_ROOT_USER: caab-local
      MINIO_ROOT_PASSWORD: replace-me-local-only
    ports:
      - "9000:9000"
      - "9001:9001"
    volumes:
      - caab-storage:/data
    healthcheck:
      test: ["CMD", "mc", "ready", "local"]
      interval: 5s
      timeout: 3s
      retries: 20

  storage-init:
    image: minio/mc:RELEASE.2025-08-13T08-35-41Z
    depends_on:
      storage:
        condition: service_healthy
    environment:
      MINIO_ENDPOINT: http://storage:9000
      MINIO_ROOT_USER: caab-local
      MINIO_ROOT_PASSWORD: replace-me-local-only
    entrypoint: ["/bin/sh", "/init.sh"]
    volumes:
      - ./infra/storage/init.sh:/init.sh:ro

  clamav:
    image: clamav/clamav:1.4
    ports:
      - "3310:3310"
    volumes:
      - ./infra/clamav/clamd.conf:/etc/clamav/clamd.conf:ro
      - caab-clamav:/var/lib/clamav
    healthcheck:
      test: ["CMD-SHELL", "printf 'PING\\n' | nc 127.0.0.1 3310 | grep PONG"]
      interval: 15s
      timeout: 5s
      retries: 30

  otel-collector:
    image: otel/opentelemetry-collector-contrib:0.139.0
    command: ["--config=/etc/otelcol/config.yaml"]
    ports:
      - "4317:4317"
      - "4318:4318"
      - "8889:8889"
    volumes:
      - ./infra/observability/otel-collector.yaml:/etc/otelcol/config.yaml:ro

volumes:
  caab-postgres:
  caab-storage:
  caab-clamav:
