packages:
  - apps/*
  - packages/*

# Drizzle and Better Auth share a Vitest peer context; keep its transformer on Vite 8's range.
overrides:
  "drizzle-kit>esbuild": "0.28.2"
  "@esbuild-kit/core-utils>esbuild": "0.28.2"
  "tsx>esbuild": "0.28.2"
  "monaco-editor>dompurify": "3.4.15"
  "docker-compose>yaml": "2.9.1"
  # High advisories (pnpm audit, 30/09/2026). Patch releases of the same lines; payload pins 7.29.0.
  "payload>undici": "7.29.1"
  "testcontainers>undici": "8.10.2"
  "@grpc/grpc-js@1": "1.14.5"
  "brace-expansion@1": "1.1.21"
  "brace-expansion@2": "2.1.7"
  "brace-expansion@5": "5.0.12"
  # Sass supports Chokidar 4; remove the vulnerable braces chain (GHSA-vfj7-8cjw-p6xm).
  "@payloadcms/next@3.89.0>sass": "1.79.4"
  # Indexed source-map offset validation (GHSA-68fv-2mgg-jv7q); keep the patched 1.2 line.
  "source-map-js": "1.2.2"

allowBuilds:
  cpu-features: false
  esbuild: true
  protobufjs: true
  ssh2: false
