packages:
  - apps/*
  - packages/*

# Drizzle and Better Auth share a Vitest peer context; keep its transformer on Vite 8's range.
overrides:
  "drizzle-kit>esbuild": "0.28.2"

allowBuilds:
  cpu-features: false
  esbuild: true
  protobufjs: true
  ssh2: false

minimumReleaseAgeExclude:
  - "@aws-sdk/client-s3@3.1127.0"
  - "@aws-sdk/s3-request-presigner@3.1127.0"
