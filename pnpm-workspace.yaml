packages:
  - apps/*
  - packages/*

# Drizzle and Better Auth share a Vitest peer context; keep its transformer on Vite 8's range.
overrides:
  "drizzle-kit>esbuild": "0.28.2"
  "@esbuild-kit/core-utils>esbuild": "0.28.2"
  "tsx>esbuild": "0.28.2"
  "monaco-editor>dompurify": "3.4.15"
  "docker-compose>yaml": "2.9.1"
  # High advisories (pnpm audit, 30/09/2026). Patch releases of the same lines; payload pins 7.29.0.
  "payload>undici": "7.29.1"
  "testcontainers>undici": "8.10.2"
  "@grpc/grpc-js@1": "1.14.5"
  "brace-expansion@1": "1.1.21"
  "brace-expansion@2": "2.1.7"
  "brace-expansion@5": "5.0.12"

allowBuilds:
  cpu-features: false
  esbuild: true
  protobufjs: true
  ssh2: false
